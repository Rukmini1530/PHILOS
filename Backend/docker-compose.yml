version: "3.8"

services:
  backend:
    build: .
    ports:
      - "8000:7860"
    environment:
      - DATABASE_URL=${DATABASE_URL:?Set DATABASE_URL in the environment or Backend/.env}
      - SECRET_KEY=${SECRET_KEY:?Set SECRET_KEY in the environment or Backend/.env}
      - DEBUG=${DEBUG:-False}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
      - API_PREFIX=/api
      - LOG_LEVEL=INFO
      - USE_S3=${USE_S3:-False}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_BUCKET_NAME=${AWS_BUCKET_NAME:-}
      - AWS_REGION=${AWS_REGION:-auto}
      - S3_ENDPOINT_URL=${S3_ENDPOINT_URL:-}
      - R2_PUBLIC_URL=${R2_PUBLIC_URL:-}
      - PRIVATE_S3_BUCKET_NAME=${PRIVATE_S3_BUCKET_NAME:-}
      - PRIVATE_S3_BUCKET_PRIVATE_ACCESS_CONFIRMED=${PRIVATE_S3_BUCKET_PRIVATE_ACCESS_CONFIRMED:-False}
    volumes:
      # Backend/app/config.py resolves BASE_DIR to /home/user/app in this image.
      # Mount each data directory there so local-only/private fallback assets persist.
      - ./uploads:/home/user/app/uploads
      - ./tiles:/home/user/app/tiles
      - ./datasets:/home/user/app/datasets
      - ./temp:/home/user/app/temp
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgis/postgis:15-3.3
    environment:
      - POSTGRES_DB=nasa_explorer
      - POSTGRES_USER=astropixel
      - POSTGRES_PASSWORD=${DB_PASSWORD:?Set DB_PASSWORD in the environment or Backend/.env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U astropixel -d nasa_explorer"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Optional: Redis for caching and Celery
  # redis:
  #   image: redis:7-alpine
  #   ports:
  #     - "6379:6379"
  #   volumes:
  #     - redis_data:/data
  #   restart: unless-stopped

volumes:
  postgres_data:
  # redis_data:
